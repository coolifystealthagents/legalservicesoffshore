<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Legal Services Offshore logo</title>
  <desc id="desc">A custom legal support and case files mark with a LSO wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26160b"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#26160b" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="#fff8ee"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(16 8) scale(1)">
  <path d="M48 20v54" stroke="#fff8ee" stroke-width="7" stroke-linecap="round"/>
  <path d="M25 32h46" stroke="#9a3412" stroke-width="7" stroke-linecap="round"/>
  <path d="M31 32 22 56h18z" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M65 32 56 56h18z" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M34 78h28" stroke="#9a3412" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect x="18" y="88" width="92" height="25" rx="12.5" fill="rgba(0,0,0,.24)"/>
  <text x="64" y="106" text-anchor="middle" font-family="Inter, Manrope, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-.5" fill="#fff8ee">LSO</text>
</svg>
